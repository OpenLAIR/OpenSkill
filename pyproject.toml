[project]
name = "openskill"
version = "1.0.0"
description = "OpenSkill: Open-World Self-Evolution for LLM Agents"
requires-python = ">=3.12"
dependencies = [
    "harbor @ git+https://github.com/laude-institute/harbor.git@3f28e5ce2acbff36d8b5df431e35e050ac13bef6",
    "litellm==1.80.0",
    "google-genai==2.22.0",
    "pdfplumber>=0.11.0",
    "tenacity>=8.2.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[tool.ruff]
target-version = "py312"
line-length = 144

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "RUF"]
ignore = ["E501", "E722", "B008", "B905", "UP038"]

[tool.ruff.lint.isort]
known-first-party = ["libs"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]
